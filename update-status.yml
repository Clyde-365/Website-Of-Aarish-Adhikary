name: Update Status Badge

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch:

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Determine User Status
        run: |
          echo "ONLINE" > status.txt # Replace this with the logic to determine the actual status
          # For example, you might check for active commits, issues, or any other activity

      - name: Update README.md
        run: |
          STATUS=$(cat status.txt)
          if [ "$STATUS" = "ONLINE" ]; then
            BADGE_URL="https://img.shields.io/badge/Status-Online-brightgreen"
          else
            BADGE_URL="https://img.shields.io/badge/Status-Offline-red"
          fi
          sed -i "s|!\[Status\](.*)|![Status](${BADGE_URL})|" README.md

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add README.md
          git commit -m "Update status badge"
          git push
